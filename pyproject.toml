[project]
name = "plant-disease-detection"
version = "0.1.0"
description = "ML project for plant disease detection using environmental features"
requires-python = ">=3.9"

dependencies = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "pillow>=9.0.0",
    "tensorflow>=2.19.0"
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
]
